apiVersion: batch/v1
kind: Job
metadata:
  name: mosemo-migration
  namespace: mosemo
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: mosemo-migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      priorityClassName: mosemo-consumer
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: mosemo-server:REPLACE_WITH_RELEASE
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: mosemo-config
            - secretRef:
                name: mosemo-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: rds-ca
              mountPath: /etc/rds-ca
              readOnly: true
      volumes:
        - name: rds-ca
          configMap:
            name: mosemo-rds-ca
