# Single-broker lab with retained EBS data; no high availability or backup.
apiVersion: v1
kind: Service
metadata:
  name: mosemo-kafka
  namespace: mosemo
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: mosemo-kafka
  ports:
    - name: kafka
      port: 9092
    - name: controller
      port: 9093
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mosemo-kafka
  namespace: mosemo
spec:
  replicas: 1
  serviceName: mosemo-kafka
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: mosemo-kafka
  template:
    metadata:
      labels:
        app: mosemo-kafka
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      # Dedicated tainted node in ap-southeast-2a (Terraform kafka node group).
      nodeSelector:
        kubernetes.io/arch: amd64
        pool: kafka
      tolerations:
        - key: dedicated
          operator: Equal
          value: kafka
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.8.0
          ports:
            - name: kafka
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: CLUSTER_ID
              value: MkU3OEVBNTcwNTJENDM2Qk
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@mosemo-kafka.mosemo.svc.cluster.local:9093
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENERS
              value: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: INTERNAL://mosemo-kafka.mosemo.svc.cluster.local:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: INTERNAL
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data/kafka
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_HEAP_OPTS
              value: -Xms128m -Xmx256m
            - name: KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE
              value: "33554432"
          startupProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [env, KAFKA_HEAP_OPTS=-Xms32m -Xmx64m, kafka-topics, --bootstrap-server, localhost:9092, --list]
            periodSeconds: 20
            timeoutSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: mosemo-kafka-gp3
        resources:
          requests:
            storage: 5Gi
