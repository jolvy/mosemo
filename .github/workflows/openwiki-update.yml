name: OpenWiki update

# main 병합 후 Claude Code(구독 OAuth)가 OpenWiki MCP로 위키를 갱신하고,
# 생성물만 `openwiki/update` 브랜치 PR로 올려 auto-merge한다.
# 모델이 쓴 결과를 PR 토큰과 떼어 놓도록 생성과 게시를 다른 job(다른 러너)에서 한다.
on:
  push:
    branches:
      - main
    # 위키 PR 병합이 다시 이 워크플로를 실행하지 않게 생성물 변경은 뺀다.
    # 지시서만 바뀐 병합은 갱신해야 하므로 다시 넣는다(마지막 일치 패턴이 이긴다).
    paths:
      - "**"
      - "!openwiki/**"
      - "openwiki/INSTRUCTIONS.md"
  workflow_dispatch:

permissions:
  contents: read

# 실행 중인 갱신은 끊지 않고, 대기 중인 실행은 가장 최근 것 하나만 남긴다.
concurrency:
  group: openwiki-update
  cancel-in-progress: false

jobs:
  generate:
    name: Generate OpenWiki
    # 다른 브랜치에서 수동 실행하면 리뷰되지 않은 코드로 위키를 만들게 된다.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # OpenWiki가 마지막 갱신 commit 이후 diff를 계산한다.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install Claude Code and OpenWiki
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.326 openwiki@0.9.0
          openwiki integrations install claude

      # 파일 쓰기는 openwiki/ 아래로만 허용한다(Edit 규칙이 Write에도 적용된다).
      - name: Update wiki with Claude Code
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: >-
          claude -p "/openwiki 이 저장소의 OpenWiki를 update 모드로 갱신해. openwiki/ 밖의 파일은 수정하지 마."
          --allowedTools "mcp__openwiki__*,Read,Grep,Glob,Edit(openwiki/**),Bash(git rev-parse --show-toplevel),Bash(git diff --name-only:*),Bash(git ls-files --others --exclude-standard)"
          --max-turns 400

      - name: Upload generated wiki
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwiki
          path: openwiki/
          # .last-update.json·.claims/ 등 점으로 시작하는 생성물도 올린다.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish OpenWiki PR
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 이벤트 commit이 아니라 최신 main 위에 올려야 앞선 위키 PR 병합과 충돌하지 않는다.
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Download generated wiki
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openwiki
          path: ${{ runner.temp }}/openwiki-generated

      - name: Verify and apply generated wiki
        run: python3 .codex/skills/verification/scripts/sync_openwiki_update.py --generated "$RUNNER_TEMP/openwiki-generated"

      - name: Open docs PR with auto-merge
        env:
          GH_TOKEN: ${{ secrets.OPENWIKI_PR_TOKEN }}
        run: |
          # 변경 없는 갱신도 .last-update.json은 바꾸므로 그 파일만 바뀌었으면 PR을 만들지 않는다.
          if [ -z "$(git status --porcelain -- openwiki ':!openwiki/.last-update.json')" ]; then
            echo "위키 변경 없음"
            exit 0
          fi
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C openwiki/update
          git add -- openwiki
          git commit -m "docs(openwiki): update generated wiki for ${GITHUB_SHA::7}"
          git push --force origin openwiki/update
          if [ -z "$(gh pr list --head openwiki/update --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head openwiki/update \
              --title "docs(openwiki): update generated wiki" \
              --body "main ${GITHUB_SHA} 기준 OpenWiki 자동 갱신 (OpenWiki update 워크플로)"
          fi
          gh pr merge openwiki/update --auto --squash
