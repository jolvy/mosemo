name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run --locked ruff check --output-format=github .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Type-check
        run: uv run --locked ty check --output-format=github

      - name: Check OpenAPI snapshot
        run: uv run --locked pytest -q tests/component/test_openapi_descriptions.py

      - name: Test
        env:
          MOSEMO_ENV: test
          DB_DATABASE: mosemo_test
          DB_USER: test
          DB_PASSWORD: test
          DB_HOST: localhost
          DB_PORT: "5432"
          KAKAO_REST_API_KEY: test-rest-api-key
          KAKAO_CLIENT_SECRET: test-client-secret
          KAKAO_REDIRECT_URI: http://localhost:8000/api/v1/auth/kakao/callback
          AUTH_JWT_SECRET_KEY: test-jwt-secret-key-that-is-at-least-32-bytes
          AUTH_MACOS_CALLBACK_URI: com.example.mosemo:/auth/callback
        run: uv run --locked pytest -q tests
