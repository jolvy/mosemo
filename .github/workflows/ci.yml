name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      openwiki_only: ${{ steps.detect.outputs.openwiki_only }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # main 대상 pull_request에서 openwiki/ 아래만 바뀌었으면 테스트 job을 건너뛴다.
      - name: Detect openwiki-only changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: python3 .codex/skills/verification/scripts/ci_gate.py changes --event "$EVENT_NAME" --base-ref "$BASE_REF" >> "$GITHUB_OUTPUT"

  static:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Validate documents
        run: uv run --locked python .codex/skills/verification/scripts/validate_docs.py

      - name: Validate architecture
        run: uv run --locked python .codex/skills/verification/scripts/validate_architecture.py

      - name: Validate code conventions
        run: uv run --locked python .codex/skills/verification/scripts/validate_conventions.py

      - name: Check cognitive complexity
        run: |
          uv run --locked complexipy src --max-complexity-allowed 15 --isolated --no-ignore
          test ! -e complexipy-snapshot.json

      - name: Lint
        run: uv run --locked ruff check --output-format=github .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Type-check
        run: uv run --locked ty check --output-format=github

      - name: Check import contracts
        run: uv run --locked lint-imports

      - name: Check OpenAPI snapshot
        run: uv run --locked pytest -q tests/integration/entrypoints/test_openapi_descriptions.py

  tests:
    name: Tests
    needs: changes
    if: needs.changes.outputs.openwiki_only != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Test
        env:
          MOSEMO_ENV: test
          DB_DATABASE: mosemo_test
          DB_USER: test
          DB_PASSWORD: test
          DB_HOST: localhost
          DB_PORT: "5432"
          KAKAO_REST_API_KEY: test-rest-api-key
          KAKAO_CLIENT_SECRET: test-client-secret
          KAKAO_REDIRECT_URI: http://localhost:8000/api/v1/auth/kakao/callback
          AUTH_JWT_SECRET_KEY: test-jwt-secret-key-that-is-at-least-32-bytes
          AUTH_MACOS_CALLBACK_URI: com.example.mosemo:/auth/callback
        run: uv run --locked pytest -q tests --cov -m "not fault_injection and not e2e"

      - name: Check coverage thresholds
        run: uv run --locked python scripts/check_coverage.py

  # 필수 검사 이름 Quality를 유지하는 집계 job이다. skipped job은 필수 검사를 통과한
  # 것으로 처리되므로 취소돼도 실행되게 always()를 쓴다.
  quality:
    name: Quality
    needs:
      - changes
      - static
      - tests
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check required jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .codex/skills/verification/scripts/ci_gate.py verdict

  fault-injection:
    name: Fault injection tests
    needs: changes
    if: needs.changes.outputs.openwiki_only != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Fault injection tests
        env:
          MOSEMO_ENV: test
          DB_DATABASE: mosemo_test
          DB_USER: test
          DB_PASSWORD: test
          DB_HOST: localhost
          DB_PORT: "5432"
          KAKAO_REST_API_KEY: test-rest-api-key
          KAKAO_CLIENT_SECRET: test-client-secret
          KAKAO_REDIRECT_URI: http://localhost:8000/api/v1/auth/kakao/callback
          AUTH_JWT_SECRET_KEY: test-jwt-secret-key-that-is-at-least-32-bytes
          AUTH_MACOS_CALLBACK_URI: com.example.mosemo:/auth/callback
        run: uv run --locked pytest -q tests -m fault_injection

  e2e:
    name: E2E tests
    needs: changes
    if: needs.changes.outputs.openwiki_only != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      # BATCH_*, ports and LABEL_MODEL are decided by the test for its processes.
      - name: E2E tests
        env:
          MOSEMO_ENV: test
          DB_DATABASE: mosemo_test
          DB_USER: test
          DB_PASSWORD: test
          DB_HOST: localhost
          DB_PORT: "5432"
          KAKAO_REST_API_KEY: test-rest-api-key
          KAKAO_CLIENT_SECRET: test-client-secret
          KAKAO_REDIRECT_URI: http://localhost:8000/api/v1/auth/kakao/callback
          AUTH_JWT_SECRET_KEY: test-jwt-secret-key-that-is-at-least-32-bytes
          AUTH_MACOS_CALLBACK_URI: com.example.mosemo:/auth/callback
        run: uv run --locked pytest -q tests/e2e -m e2e
