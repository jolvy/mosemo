name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # pull_request의 merge commit과 첫 부모(base)를 비교하려면 두 commit이 필요하다.
          fetch-depth: 2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Validate documents
        run: uv run --locked python .codex/skills/verification/scripts/validate_docs.py

      - name: Protect generated OpenWiki pages
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: >-
          uv run --locked python .codex/skills/verification/scripts/check_openwiki_paths.py
          --head-ref "$HEAD_REF" --same-repo "$SAME_REPO"

      - name: Validate architecture
        run: uv run --locked python .codex/skills/verification/scripts/validate_architecture.py

      - name: Validate code conventions
        run: uv run --locked python .codex/skills/verification/scripts/validate_conventions.py

      - name: Check cognitive complexity
        run: |
          uv run --locked complexipy src --max-complexity-allowed 15 --isolated --no-ignore
          test ! -e complexipy-snapshot.json

      - name: Lint
        run: uv run --locked ruff check --output-format=github .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Type-check
        run: uv run --locked ty check --output-format=github

      - name: Check import contracts
        run: uv run --locked lint-imports

      - name: Check OpenAPI snapshot
        run: uv run --locked pytest -q tests/integration/entrypoints/test_openapi_descriptions.py

      - name: Test
        env:
          MOSEMO_ENV: test
          DB_DATABASE: mosemo_test
          DB_USER: test
          DB_PASSWORD: test
          DB_HOST: localhost
          DB_PORT: "5432"
          KAKAO_REST_API_KEY: test-rest-api-key
          KAKAO_CLIENT_SECRET: test-client-secret
          KAKAO_REDIRECT_URI: http://localhost:8000/api/v1/auth/kakao/callback
          AUTH_JWT_SECRET_KEY: test-jwt-secret-key-that-is-at-least-32-bytes
          AUTH_MACOS_CALLBACK_URI: com.example.mosemo:/auth/callback
        run: uv run --locked pytest -q tests --cov

      - name: Check coverage thresholds
        run: uv run --locked python scripts/check_coverage.py
