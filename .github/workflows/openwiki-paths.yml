name: OpenWiki paths

# pull_request_target은 PR이 아니라 base 브랜치의 워크플로와 스크립트를 실행하므로
# PR이 이 검사를 끄거나 약하게 만들 수 없다. PR head는 commit 데이터로만 받고
# checkout하거나 실행하지 않는다.
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

jobs:
  openwiki-paths:
    name: OpenWiki paths
    runs-on: ubuntu-latest

    steps:
      - name: Check out base repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Protect generated OpenWiki pages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          python3 .codex/skills/verification/scripts/check_openwiki_paths.py --base "$base" --head "$HEAD_SHA" --head-ref "$HEAD_REF" --same-repo "$SAME_REPO"
