default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
        stages: [pre-commit, pre-push]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix
        language: system
        stages: [pre-commit]
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        stages: [pre-commit]
        types_or: [python, pyi]
      - id: ty-check
        name: ty check
        entry: uv run --locked ty check
        language: system
        stages: [pre-commit]
        pass_filenames: false
        files: '(^|/).*\.py$|^pyproject\.toml$|^uv\.lock$'
