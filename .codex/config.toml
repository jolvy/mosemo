default_permissions = "mosemo"
approval_policy = "on-request"

[permissions.mosemo]
extends = ":workspace"

[permissions.project-edit.filesystem]
":workspace_roots" = "write"

[permissions.mosemo.filesystem.":workspace_roots"]
"**/.env" = "deny"
"**/.env.local" = "deny"
"**/.env.test" = "deny"
"**/.env.prod" = "deny"

[permissions.mosemo.network]
enabled = true
